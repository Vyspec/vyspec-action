name: Vyspec QA
description: Run Vyspec QA against an application on a GitHub Actions runner.
author: Vyspec

branding:
  color: blue
  icon: eye

inputs:
  project-api-key:
    description: Revocable Vyspec Project API key stored as a GitHub Actions secret.
    required: true
  run-profile-id:
    description: UUID of the saved Run Profile to execute.
    required: false
  instructions:
    description: Direct QA instructions for this Run.
    required: false
  instructions-file:
    description: Repository-relative path to a plain-text QA instructions file.
    required: false
  session-profile-id:
    description: Optional Session Profile UUID for authenticating a direct Run.
    required: false
  start-path:
    description: Optional origin-relative page to open for a direct Run.
    required: false
  run-notes-file:
    description: Repository-relative path to a JSON array of customer-supplied Run notes.
    required: false
  app-ready-timeout:
    default: "120"
    description: Seconds to wait for the application on loopback port 3000.
    required: false
  pull-request-number:
    description: Pull-request number to associate with the Run when the workflow was not triggered by pull_request.
    required: false
  ci-branch:
    description: Source branch to associate with the Run when GitHub cannot infer it from the event.
    required: false

outputs:
  exit-code:
    description: Vyspec operational process exit code. A completed QA failure still returns zero.
    value: ${{ steps.qa.outputs.exit_code }}
  finding-count:
    description: Number of confirmed findings in the completed Run.
    value: ${{ steps.result.outputs.finding_count }}
  qa-verdict:
    description: Final QA verdict when the runner completed.
    value: ${{ steps.result.outputs.qa_verdict }}
  result-file:
    description: Path to the canonical Vyspec JSON result on the Actions runner.
    value: ${{ steps.result.outputs.result_file }}
  run-id:
    description: Vyspec Run identifier when execution started.
    value: ${{ steps.result.outputs.run_id }}
  run-url:
    description: Authenticated Vyspec web URL for the completed Run.
    value: ${{ steps.result.outputs.run_url }}

runs:
  using: composite
  steps:
    - name: Validate Vyspec configuration
      shell: bash
      env:
        VSY_INSTRUCTIONS: ${{ inputs.instructions }}
        VSY_INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        VSY_PROJECT_API_KEY: ${{ inputs.project-api-key }}
        VSY_RUN_NOTES_FILE: ${{ inputs.run-notes-file }}
        VSY_RUN_PROFILE_ID: ${{ inputs.run-profile-id }}
        VSY_SESSION_PROFILE_ID: ${{ inputs.session-profile-id }}
        VSY_START_PATH: ${{ inputs.start-path }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" != "Linux" ]]; then
          echo "::error::Vyspec currently supports GitHub-hosted Ubuntu runners only."
          exit 2
        fi
        if [[ -z "${VSY_PROJECT_API_KEY}" ]]; then
          echo "::error::project-api-key is required."
          exit 2
        fi
        source_count=0
        [[ -n "${VSY_RUN_PROFILE_ID}" ]] && ((source_count += 1))
        [[ -n "${VSY_INSTRUCTIONS}" ]] && ((source_count += 1))
        [[ -n "${VSY_INSTRUCTIONS_FILE}" ]] && ((source_count += 1))
        if [[ "${source_count}" -ne 1 ]]; then
          echo "::error::Set exactly one of run-profile-id, instructions, or instructions-file."
          exit 2
        fi
        if [[ -n "${VSY_RUN_PROFILE_ID}" && ( -n "${VSY_SESSION_PROFILE_ID}" || -n "${VSY_START_PATH}" ) ]]; then
          echo "::error::session-profile-id and start-path are available only for direct instructions."
          exit 2
        fi
        if [[ -n "${VSY_INSTRUCTIONS_FILE}" && ! -f "${VSY_INSTRUCTIONS_FILE}" ]]; then
          echo "::error::The instructions-file does not exist."
          exit 2
        fi
        if [[ -n "${VSY_RUN_NOTES_FILE}" && ! -f "${VSY_RUN_NOTES_FILE}" ]]; then
          echo "::error::The run-notes-file does not exist."
          exit 2
        fi

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install the Vyspec CLI
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        VYSPEC_CLI_VERSION: "0.1.6"
      run: python -m pip install "vyspec==${VYSPEC_CLI_VERSION}"

    - name: Install the Vyspec browser
      shell: bash
      run: vsy install-browser --with-deps

    - name: Run Vyspec QA
      id: qa
      continue-on-error: true
      shell: bash
      env:
        CI: "true"
        VSY_APP_READY_TIMEOUT: ${{ inputs.app-ready-timeout }}
        VSY_CI_BRANCH: ${{ inputs.ci-branch || github.head_ref || github.ref_name }}
        VSY_CI_PROVIDER: github
        VSY_CI_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number || github.event.pull_request.number || github.event.issue.number }}
        VSY_CI_REPOSITORY: ${{ github.repository }}
        VSY_INSTRUCTIONS: ${{ inputs.instructions }}
        VSY_INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        VSY_PROJECT_API_KEY: ${{ inputs.project-api-key }}
        VSY_RESULT_FILE: ${{ runner.temp }}/vyspec-result.json
        VSY_RUN_NOTES_FILE: ${{ inputs.run-notes-file }}
        VSY_RUN_PROFILE_ID: ${{ inputs.run-profile-id }}
        VSY_SESSION_PROFILE_ID: ${{ inputs.session-profile-id }}
        VSY_START_PATH: ${{ inputs.start-path }}
      run: |
        set -euo pipefail
        rm -f "${VSY_RESULT_FILE}"
        VSY_CI_COMMIT_SHA="$(git rev-parse --verify HEAD)"
        export VSY_CI_COMMIT_SHA
        arguments=(
          run
          --app-ready-timeout "${VSY_APP_READY_TIMEOUT}"
          --result-file "${VSY_RESULT_FILE}"
        )
        if [[ -n "${VSY_RUN_PROFILE_ID}" ]]; then
          arguments+=(--profile "${VSY_RUN_PROFILE_ID}")
        elif [[ -n "${VSY_INSTRUCTIONS}" ]]; then
          arguments+=(--instructions "${VSY_INSTRUCTIONS}")
        else
          arguments+=(--instructions-file "${VSY_INSTRUCTIONS_FILE}")
        fi
        if [[ -n "${VSY_SESSION_PROFILE_ID}" ]]; then
          arguments+=(--session-profile "${VSY_SESSION_PROFILE_ID}")
        fi
        if [[ -n "${VSY_START_PATH}" ]]; then
          arguments+=(--start-path "${VSY_START_PATH}")
        fi
        if [[ -n "${VSY_RUN_NOTES_FILE}" ]]; then
          arguments+=(--notes "${VSY_RUN_NOTES_FILE}")
        fi
        set +e
        vsy "${arguments[@]}"
        exit_code=$?
        set -e
        echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
        exit "${exit_code}"

    - name: Read Vyspec result
      id: result
      if: ${{ always() }}
      shell: bash
      env:
        VSY_RESULT_FILE: ${{ runner.temp }}/vyspec-result.json
      run: |
        echo "result_file=${VSY_RESULT_FILE}" >> "${GITHUB_OUTPUT}"
        if [[ ! -s "${VSY_RESULT_FILE}" ]]; then
          exit 0
        fi
        echo "run_id=$(jq -r '.run_id' "${VSY_RESULT_FILE}")" >> "${GITHUB_OUTPUT}"
        echo "qa_verdict=$(jq -r '.qa_verdict' "${VSY_RESULT_FILE}")" >> "${GITHUB_OUTPUT}"
        echo "run_url=$(jq -r '.run_url' "${VSY_RESULT_FILE}")" >> "${GITHUB_OUTPUT}"
        echo "finding_count=$(jq -r '(.findings // []) | length' "${VSY_RESULT_FILE}")" >> "${GITHUB_OUTPUT}"
        echo "findings=$(jq -c '.findings // []' "${VSY_RESULT_FILE}")" >> "${GITHUB_OUTPUT}"

    - name: Update pull-request report
      if: ${{ always() }}
      shell: bash
      env:
        VSY_PROJECT_API_KEY: ${{ inputs.project-api-key }}
        VSY_PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number || github.event.pull_request.number || github.event.issue.number }}
        VSY_REPOSITORY_ID: ${{ github.repository_id }}
        VSY_RESULT_FILE: ${{ runner.temp }}/vyspec-result.json
      run: |
        set -euo pipefail
        if [[ ! "${VSY_PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]*$ || ! "${VSY_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]]; then
          echo "No pull request or repository ID was supplied; skipping the GitHub report."
          exit 0
        fi
        api_url="${VSY_API_URL:-https://www.vyspec.com}"
        if [[ ! "${api_url}" =~ ^https://[^/]+/?$ && ! "${api_url}" =~ ^http://(127\.0\.0\.1|localhost)(:[0-9]+)?/?$ ]]; then
          echo "::error::VSY_API_URL must be an HTTPS origin."
          exit 2
        fi
        api_url="${api_url%/}"
        result="null"
        if [[ -s "${VSY_RESULT_FILE}" ]]; then
          result="$(jq -c '{findings, qa_verdict, run_id, run_url}' "${VSY_RESULT_FILE}")"
        fi
        payload="$(jq -cn \
          --argjson change_request_number "${VSY_PULL_REQUEST_NUMBER}" \
          --arg provider_repository_id "${VSY_REPOSITORY_ID}" \
          --argjson result "${result}" \
          '{change_request_number: $change_request_number, provider_repository_id: $provider_repository_id, result: $result}')"
        curl --silent --show-error --fail-with-body --retry 2 \
          --request POST \
          --header "Authorization: Bearer ${VSY_PROJECT_API_KEY}" \
          --header "Content-Type: application/json" \
          --data "${payload}" \
          "${api_url}/api/v1/integrations/github/report"

    - name: Preserve Vyspec operational status
      if: ${{ always() && steps.qa.outcome == 'failure' }}
      shell: bash
      env:
        VSY_EXIT_CODE: ${{ steps.qa.outputs.exit_code }}
      run: exit "${VSY_EXIT_CODE:-2}"
